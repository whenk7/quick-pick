# 需要的 4 个 repo secret：
#   KEYSTORE_BASE64（keystore.jks 的 base64 编码）
#   KEYSTORE_PASSWORD、KEY_ALIAS、KEY_PASSWORD
# keystore 永不入库——只存在于 secret 与 runner 临时目录，构建结束即销毁。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runner 预装 Android SDK + cmdline-tools，无需第三方 action
      # （android-actions/setup-android@v3 会在 sdkmanager 协议确认处卡死，已踩过）
      - name: Accept licenses & install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build signed release APK
        run: ./gradlew assembleRelease lintVitalRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "quickpick-${GITHUB_REF_NAME}.apk"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: quickpick-${{ github.ref_name }}.apk
